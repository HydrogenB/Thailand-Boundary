<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thailand Boundary POC — GISTDA Province_TH</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; z-index: 1000; top: 12px; left: 12px; width: 300px;
    padding: 12px 14px; background: #fff; border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); font-size: 13px; line-height: 1.5;
  }
  .panel h1 { margin: 0 0 4px; font-size: 15px; }
  .src { color: #666; font-size: 11px; margin-bottom: 10px; word-break: break-all; }
  .result { font-size: 15px; font-weight: 700; margin: 8px 0 4px; }
  .in { color: #137333; } .out { color: #b3261e; } .muted { color: #666; font-weight: 400; }
  label { display: block; margin-top: 8px; color: #444; }
  input, select { width: 100%; font: inherit; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Thailand Boundary POC</h1>
  <div class="src">GISTDA — Hosted/Province_TH/FeatureServer/0 (EPSG:4326)</div>
  <div id="result" class="result muted">กำลังโหลดขอบเขต…</div>
  <div id="detail" class="muted"></div>
  <label>ความละเอียด (maxAllowableOffset, องศา)
    <select id="offset">
      <option value="0.01">0.01 — เร็ว (~150 KB)</option>
      <option value="0.002" selected>0.002 — สมดุล (~580 KB)</option>
      <option value="0">0 — เต็มความละเอียด (~39 MB)</option>
    </select>
  </label>
  <label>หรือใช้ไฟล์ที่ดาวน์โหลดเอง (.geojson)
    <input type="file" id="file" accept=".geojson,.json" />
  </label>
  <div class="src" style="margin-top:8px">คลิกบนแผนที่เพื่อตรวจว่าพิกัดอยู่ในจังหวัดใด</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const QUERY = "https://gistdaportal.gistda.or.th/arcgis/rest/services/Hosted/Province_TH/FeatureServer/0/query" +
  "?where=1%3D1&outFields=p_code,p_name_t,p_name_e&returnGeometry=true&outSR=4326&f=geojson";

const map = L.map("map").setView([13.0, 101.0], 6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap | ขอบเขต: GISTDA"
}).addTo(map);

const result = document.getElementById("result");
const detail = document.getElementById("detail");
let layer = null, features = [], marker = null;

// ray casting; ring[0] = outer, ring[1..] = holes
const inRing = ([x, y], ring) => {
  let hit = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) hit = !hit;
  }
  return hit;
};
const inPolygon = (pt, poly) => inRing(pt, poly[0]) && !poly.slice(1).some(h => inRing(pt, h));
const inGeometry = (pt, g) =>
  g.type === "Polygon" ? inPolygon(pt, g.coordinates)
                       : g.coordinates.some(p => inPolygon(pt, p));

function render(geojson, label) {
  features = geojson.features || [geojson];
  if (layer) layer.remove();
  layer = L.geoJSON(geojson, {
    style: { color: "#1a73e8", weight: 1, fillColor: "#1a73e8", fillOpacity: 0.08 }
  }).addTo(map);
  map.fitBounds(layer.getBounds());
  result.className = "result muted";
  result.textContent = "พร้อมใช้งาน — คลิกบนแผนที่";
  detail.textContent = `${features.length} จังหวัด · ${label}`;
}

async function load(offset) {
  result.className = "result muted";
  result.textContent = "กำลังโหลดขอบเขต…";
  const url = QUERY + (Number(offset) > 0 ? "&maxAllowableOffset=" + offset : "");
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  render(data, `GISTDA live (offset ${offset})`);
}

function check(latlng) {
  const pt = [latlng.lng, latlng.lat];
  const hit = features.find(f => f.geometry && inGeometry(pt, f.geometry));
  if (marker) marker.remove();
  marker = L.circleMarker(latlng, {
    radius: 6, color: hit ? "#137333" : "#b3261e", fillOpacity: 1
  }).addTo(map);
  result.className = "result " + (hit ? "in" : "out");
  result.textContent = hit ? "อยู่ในประเทศไทย ✓" : "อยู่นอกขอบเขต ✗";
  const p = hit && hit.properties;
  detail.textContent =
    `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}` +
    (p ? ` · ${p.p_name_t || ""} (${p.p_name_e || ""}) · code ${p.p_code}` : "");
}

map.on("click", e => features.length && check(e.latlng));

document.getElementById("offset").onchange = e =>
  load(e.target.value).catch(err => {
    result.className = "result out";
    result.textContent = "โหลดไม่สำเร็จ: " + err.message;
    detail.textContent = "ลองดาวน์โหลด GeoJSON แล้วเลือกไฟล์ด้านล่างแทน";
  });

document.getElementById("file").onchange = async e => {
  const f = e.target.files[0];
  if (f) render(JSON.parse(await f.text()), "local file: " + f.name);
};

document.getElementById("offset").onchange({ target: { value: "0.002" } });
</script>
</body>
</html>
